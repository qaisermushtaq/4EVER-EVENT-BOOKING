name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Is se aap manually button daba kar bhi build chala sakte hain

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Capacitor Project & Build Android
        run: |
          # 1. Project directory setup
          mkdir -p www
          cp index.html www/index.html

          # 2. Package install
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          # 3. Capacitor Config Create
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.fourever.eventbooking",
            "appName": "4ever Event Booking",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          # 4. Add Android Platform & Sync
          npx cap add android
          npx cap sync android

          # 5. Build APK via Gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4ever-Event-Booking-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
